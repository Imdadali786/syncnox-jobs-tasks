<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syncnox — Jobs &amp; tasks</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap');

  body{margin:0;background:#fff}
  #jb{
    --gray-10:#f4f4f4; --gray-20:#e0e0e0; --gray-30:#c6c6c6; --gray-50:#8d8d8d; --gray-70:#525252; --ink:#161616;
    --g-050:#EAF3DA; --accent:#015c11; --bright:#00c80d; --lime:#9CFF8F;
    --muted:var(--gray-70); --faint:var(--gray-50);
    --grad:linear-gradient(90deg,#015c11,#00c80d);
    --scr:#FBFCF8; --scr-bar:#F2F4EC; --sub:#5A6B45;
    --blue:#0f62fe; --blue-050:#edf5ff; --red:#da1e28; --red-050:#fff1f1; --orange:#ff832b; --orange-ink:#c65300; --orange-050:#fff2e8;
    --teal:#007d79; --teal-050:#d9fbfb; --purple:#8a3ffc;
    --f:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,0,.38,.9); --ease-soft:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.22,1,.36,1);
    font-family:var(--f);color:var(--muted);line-height:1.5;-webkit-font-smoothing:antialiased;
    font-feature-settings:"zero" 0,"ss01" 0;font-variant-numeric:lining-nums tabular-nums;
    background:#fff;padding:clamp(64px,8vw,112px) 0;position:relative;
  }
  #jb *,#jb *::before,#jb *::after{box-sizing:border-box;border-radius:0}
  #jb .wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
  #jb svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* header */
  #jb .sec-head{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(20px,4vw,56px);align-items:end;margin:0 0 clamp(36px,4.4vw,52px)}
  #jb .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:10px;margin:0 0 18px}
  #jb .eyebrow::before{content:"";width:22px;height:3px;background:var(--grad)}
  #jb h2{font-weight:400;letter-spacing:-.025em;line-height:1.06;font-size:clamp(30px,3.8vw,44px);margin:0;
    background:linear-gradient(100deg,#0A0A0A 0%,#013a0b 46%,#00c80d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  #jb h2 .hl{font-weight:600}
  #jb .sec-head p{margin:0;font-size:1.02rem;line-height:1.6}

  /* frame + screen */
  #jb .frame{position:relative;background:linear-gradient(150deg,#000 0%,#013a0b 42%,#00c80d 100%);padding:clamp(10px,2.8vw,36px);overflow:hidden}
  #jb .frame::before{content:"";position:absolute;inset:0;background:radial-gradient(560px circle at var(--mx,24%) var(--my,14%),rgba(90,255,120,.42),rgba(0,200,13,.15) 46%,transparent 74%);pointer-events:none}
  #jb .scr{position:relative;z-index:1;background:var(--scr);box-shadow:0 30px 60px rgba(8,16,4,.45)}
  #jb .bar{display:flex;align-items:center;gap:10px;height:42px;padding:0 6px 0 16px;background:var(--scr-bar);font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink)}
  #jb .bar .sq{width:8px;height:8px;background:var(--accent);flex:none}
  #jb .bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #jb .bar .t em{font-style:normal;color:var(--faint);font-weight:500}
  #jb .state{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:9px;font-weight:700;letter-spacing:.1em;padding:4px 8px;background:var(--sb,var(--gray-10));color:var(--sc,var(--muted));white-space:nowrap;transition:background .3s,color .3s}
  #jb .state i{width:5px;height:5px;background:currentColor}
  #jb .ib{width:30px;height:30px;flex:none;border:none;background:none;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
  #jb .ib:hover{background:#fff;color:var(--ink)}
  #jb .ib svg{width:15px;height:15px}
  #jb .ib:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  #jb .body{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:2px;padding:12px 14px 16px}

  /* ===== left: import + job list (stacked) ===== */
  #jb .left{position:relative;display:grid;background:#fff;min-width:0}
  #jb .lp{grid-area:1/1;padding:14px;opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s linear .4s;min-width:0}
  #jb .lp.on{opacity:1;visibility:visible;transition:opacity .45s var(--ease),visibility 0s}
  #jb .ph{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--faint);white-space:nowrap}
  #jb .ph svg{width:13px;height:13px;color:var(--pc,var(--ink))}
  #jb .ph .r{margin-left:auto;font-weight:600;color:var(--sub);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}

  /* import */
  #jb .file{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--blue-050)}
  #jb .file .fi{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff}
  #jb .file .fi svg{width:19px;height:19px}
  #jb .file b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
  #jb .file small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.04em}
  #jb .file em{font-style:normal;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--blue)}
  #jb .map{margin-top:10px;display:flex;flex-direction:column;gap:2px}
  #jb .mp{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr) 20px;gap:8px;align-items:center;padding:8px 10px;background:var(--scr);font-size:12px;opacity:0;transform:translateX(-6px);transition:opacity .35s var(--ease),transform .4s var(--ease-out)}
  #jb .mp.on{opacity:1;transform:none}
  #jb .mp .src{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #jb .mp .ar{color:var(--gray-30);font-size:12px}
  #jb .mp .dst{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #jb .mp .ok{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff}
  #jb .mp .ok svg{width:11px;height:11px;stroke-width:2.4}
  #jb .geo{margin-top:12px}
  #jb .geo small{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--faint);margin-bottom:6px}
  #jb .geo small b{color:var(--ink)}
  #jb .gb{height:6px;background:var(--gray-10);position:relative}
  #jb .gb i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue)}
  #jb .fix{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);opacity:0;transition:opacity .4s}
  #jb .fix.on{opacity:1}
  #jb .fix b{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;padding:3px 6px;background:var(--blue-050);color:var(--blue)}

  /* list */
  #jb .chips{position:relative;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;min-height:26px}
  #jb .isum{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--blue-050);font-size:12px;color:var(--muted);transition:opacity .35s}
  #jb .isum svg{width:15px;height:15px;color:var(--blue)}
  #jb .isum b{color:var(--ink);font-weight:600}
  #jb .isum em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--blue);white-space:nowrap}
  #jb .l2 .isum{opacity:0;pointer-events:none}
  #jb .tc{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;background:var(--gray-10);font-size:11.5px;font-weight:500;color:var(--muted);opacity:0;transform:translateY(4px);transition:opacity .3s,transform .35s var(--ease-out),background .3s,color .3s}
  #jb .tc.on{opacity:1;transform:none}
  #jb .tc svg{width:13px;height:13px}
  #jb .tc b{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink)}
  #jb .tc.hl{background:var(--ink);color:#fff}
  #jb .tc.hl b{color:#fff}
  #jb .lh,#jb .row{display:grid;grid-template-columns:24px minmax(0,1.5fr) minmax(0,.9fr) 62px minmax(0,1.1fr);gap:10px;align-items:center;padding:0 8px}
  #jb .lh{height:24px;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.1em;color:var(--faint)}
  #jb .lh span{transition:opacity .3s}
  #jb .rows{position:relative;height:calc(6 * 42px)}
  #jb .row{position:absolute;left:0;right:0;height:40px;background:var(--scr);transition:top .7s var(--ease-out),background .35s,opacity .4s}
  #jb .row.sel{background:#fff;box-shadow:inset 3px 0 0 var(--ink),0 6px 16px rgba(22,22,22,.07)}
  #jb .row .ti{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--gray-10);color:var(--ink)}
  #jb .row .ti svg{width:13px;height:13px}
  #jb .row .ad b{display:block;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--ink);letter-spacing:.02em}
  #jb .row .ad span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #jb .row .ad span svg{width:11px;height:11px;color:var(--blue);flex:none}
  #jb .row .ty{font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #jb .row .pr{justify-self:start;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:3px 6px;white-space:nowrap}
  #jb .pr.urgent{background:var(--red);color:#fff}
  #jb .pr.high{background:var(--orange-050);color:var(--orange-ink)}
  #jb .pr.normal{background:var(--gray-10);color:var(--muted)}
  #jb .pr.low{background:#fff;color:var(--faint);box-shadow:inset 0 0 0 1px var(--gray-20)}
  #jb .row .wd{position:relative;height:10px;background:var(--gray-10)}
  #jb .row .wd i{position:absolute;top:0;bottom:0;background:var(--ink)}
  #jb .row .wd i.soft{background:#fff;box-shadow:inset 0 0 0 1.5px var(--gray-50)}
  #jb .row.sel .wd i{background:var(--orange-ink)}
  #jb .c2,#jb .c3{opacity:0;transition:opacity .4s var(--ease)}
  #jb .l2 .c2,#jb .l3 .c3{opacity:1}
  #jb .lf{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--faint)}
  #jb .lf b{color:var(--ink)}
  #jb .wleg{display:inline-flex;gap:10px}
  #jb .wleg span{display:inline-flex;align-items:center;gap:5px}
  #jb .wleg i{display:inline-block;width:14px;height:6px;background:var(--ink)}
  #jb .wleg i.soft{background:#fff;box-shadow:inset 0 0 0 1.5px var(--gray-50)}

  /* ===== right: the one record ===== */
  #jb .rec{background:#fff;padding:14px;min-width:0;display:flex;flex-direction:column}
  #jb .rh{display:flex;align-items:center;gap:10px}
  #jb .rh .id{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--ink);color:#fff;padding:5px 8px}
  #jb .rh b{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #jb .rh .st{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;padding:4px 7px;background:var(--lb);color:var(--lc);white-space:nowrap;transition:background .3s,color .3s}
  /* lifecycle */
  #jb .life{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin:14px 0 4px}
  #jb .lc{display:flex;flex-direction:column;gap:6px;min-width:0}
  #jb .lc i{display:block;height:4px;background:var(--gray-10);transition:background .4s}
  #jb .lc span{font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
  #jb .lc.done i{background:var(--accent)}
  #jb .lc.done span{color:var(--muted)}
  #jb .lc.cur i{background:var(--accent);animation:jbPulse 1s steps(1) infinite}
  #jb .lc.cur span{color:var(--ink);font-weight:700}
  @keyframes jbPulse{50%{opacity:.35}}
  /* fields */
  #jb .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;margin-top:12px}
  #jb .fd{position:relative;padding:8px 10px 9px;background:var(--scr);min-width:0;transition:background .4s}
  #jb .fd small{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.1em;color:var(--faint)}
  #jb .fd small svg{width:11px;height:11px}
  #jb .fd b{display:block;margin-top:3px;font-size:12.5px;font-weight:500;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
  #jb .fd.full b{color:var(--ink)}
  #jb .fd.hit{background:var(--hb)}
  #jb .fd.hit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--hc)}
  #jb .fd.w2{grid-column:1/-1}
  #jb .proof{display:inline-flex;gap:4px;vertical-align:middle}
  #jb .proof em{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;padding:2px 6px;background:var(--gray-10);color:var(--muted)}
  #jb .proof em svg{width:11px;height:11px}
  #jb .proof em.ok{background:var(--accent);color:#fff}
  #jb .ready{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--gray-30);transition:color .3s}
  #jb .ready i{width:8px;height:8px;background:currentColor}
  #jb .ready.on{color:var(--accent)}

  /* ===== steps rail (under the frame) ===== */
  #jb .rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(16px,2.6vw,36px);margin-top:28px}
  #jb .stp{position:relative;padding:20px 0 0;display:grid;grid-template-columns:36px 1fr;gap:14px;text-align:left;background:none;border:none;cursor:pointer;font-family:inherit;color:inherit}
  #jb .stp:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
  #jb .stp .b2{position:absolute;left:0;right:0;top:0;height:3px;background:var(--gray-10);overflow:hidden}
  #jb .stp .b2 i{display:block;height:100%;width:0;background:var(--pc)}
  #jb .stp.done .b2 i{width:100%;opacity:.35}
  #jb .stp.on .b2 i{width:100%}
  #jb .stp.on.run .b2 i{width:0;animation:jbFill var(--dw,8500ms) linear forwards}
  #jb .stp.on.run.hold .b2 i{animation-play-state:paused}
  @keyframes jbFill{to{width:100%}}
  #jb .stp .pi{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--gray-10);color:var(--faint);transition:background .3s,color .3s}
  #jb .stp .pi svg{width:17px;height:17px}
  #jb .stp.on .pi{background:var(--pc);color:#fff}
  #jb .stp:hover .pi{color:var(--pc)}
  #jb .stp.on:hover .pi{color:#fff}
  #jb .stp b{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:600;color:var(--muted);letter-spacing:-.01em;line-height:1.3;transition:color .3s}
  #jb .stp b small{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--gray-30)}
  #jb .stp.on b{color:var(--ink)}
  #jb .stp.on b small{color:var(--pc)}
  #jb .stp span.d{display:block;margin-top:4px;font-size:.9rem;line-height:1.5;color:var(--faint);transition:color .3s}
  #jb .stp.on span.d{color:var(--muted)}
  #jb .note{margin-top:22px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;color:var(--gray-30)}

  #jb .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease-soft),transform .8s var(--ease-soft)}
  #jb .reveal.in{opacity:1;transform:none}
  #jb .reveal.d1{transition-delay:.1s}

  @media(max-width:980px){
    #jb .sec-head{grid-template-columns:1fr;gap:14px}
    #jb .body{grid-template-columns:minmax(0,1fr)}
  }
  @media(max-width:720px){
    #jb .rail{grid-template-columns:minmax(0,1fr);row-gap:4px}
    #jb .stp{padding:12px 0 12px 16px}
    #jb .stp .b2{right:auto;bottom:0;width:3px;height:auto}
    #jb .stp .b2 i{width:100%!important;height:0}
    #jb .stp.done .b2 i,#jb .stp.on .b2 i{height:100%}
    #jb .stp.on.run .b2 i{height:0;animation:jbFillV var(--dw,8500ms) linear forwards}
    @keyframes jbFillV{to{height:100%}}
  }
  @media(max-width:640px){
    #jb .bar .t em{display:none}
    #jb .state .lg{display:none}
    #jb .body{padding:10px 10px 12px}
    #jb .lp,#jb .rec{padding:12px 10px}
    #jb .lh,#jb .row{grid-template-columns:22px minmax(0,1.4fr) 54px minmax(0,1fr);gap:8px;padding:0 6px}
    #jb .lh .ty,#jb .row .ty{display:none}
    #jb .row .ti{width:22px;height:22px}
    #jb .lf .wleg{display:none}
    #jb .life span{display:none}
    #jb .life{margin-bottom:0}
    #jb .ph .r{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    #jb *{animation:none!important;transition:none!important}
    #jb .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

<section id="jb" aria-labelledby="jbTitle">
  <div class="wrap">
    <div class="sec-head reveal">
      <div>
        <span class="eyebrow">Jobs &amp; tasks</span>
        <h2 id="jbTitle">One record,<br><span class="hl">booking to done.</span></h2>
      </div>
      <p>Every job carries what the plan needs — and what the field team needs to finish first time.</p>
    </div>

    <div class="reveal d1">
      <div class="frame" id="jbFrame">
        <div class="scr">
          <div class="bar"><span class="sq"></span><span class="t">Jobs <em>· Week 42 · Leeds North</em></span><span class="state" id="jbState"><i></i>READY</span>
            <button type="button" class="ib" id="jbReplay" aria-label="Replay"></button></div>
          <div class="body">
            <div class="left" id="jbLeft">
              <div class="lp" id="lpImport"></div>
              <div class="lp" id="lpList"></div>
            </div>
            <div class="rec" id="jbRec" aria-live="polite"></div>
          </div>
        </div>
      </div>
      <div class="rail" id="jbRail" role="tablist" aria-label="Jobs and tasks"></div>
      <div class="note">SAMPLE WEEK · 128 JOBS · ILLUSTRATIVE</div>
    </div>
  </div>
</section>

<script>
(function(){
  var root=document.getElementById('jb'); if(!root) return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

<script>
/* iframe helper: report real height to the parent page */
(function(){
  if(window.parent===window)return;
  var last=0;
  function send(){
